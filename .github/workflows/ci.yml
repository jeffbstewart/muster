name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  presubmit:
    # 7-bit ASCII + gofmt + go vet + tests (scripts/presubmit.sh, the
    # same checks the pre-commit hook runs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: presubmit
        run: sh scripts/presubmit.sh

  image:
    # Build the scratch image and push it to ghcr.io/jeffbstewart/muster
    # on pushes to main and version tags -- only after presubmit passes.
    # Uses the built-in GITHUB_TOKEN (no PAT); the package inherits the
    # public repo's visibility.
    needs: [presubmit]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
